name: Release @kentra/ui-kit

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Run unit and quality-gate tests
        run: npm run test

      - name: Run type checks
        run: npm run test:typecheck

      - name: Build package
        run: npm run build

      - name: Validate package contents
        run: npm run pack:dry

      - name: Check published version
        id: version_check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.version_check.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Resolve package URL
        if: steps.version_check.outputs.exists == 'false'
        id: package_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME="${{ steps.version_check.outputs.name }}"
          ENCODED_NAME=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$PKG_NAME")
          PACKAGE_URL=$(gh api "/orgs/${{ github.repository_owner }}/packages/npm/${ENCODED_NAME}" --jq '.html_url' 2>/dev/null || true)

          if [ -z "$PACKAGE_URL" ] || [ "$PACKAGE_URL" = "null" ]; then
            PACKAGE_URL="https://github.com/orgs/${{ github.repository_owner }}/packages?repo_name=${{ github.event.repository.name }}"
          fi

          echo "url=$PACKAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.version_check.outputs.exists == 'false'
        id: release_tag
        run: |
          TAG="v${{ steps.version_check.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.name }}"
          VERSION="${{ steps.version_check.outputs.version }}"
          PACKAGE_NAME="${{ steps.version_check.outputs.name }}"
          PACKAGE_URL="${{ steps.package_url.outputs.url }}"

          cat > release-notes.md <<EOF
          ## Package
          - \`${PACKAGE_NAME}@${VERSION}\`
          - [GitHub Packages](${PACKAGE_URL})
          - Registry: \`https://npm.pkg.github.com\`

          Install:
          \`\`\`bash
          npm install ${PACKAGE_NAME}@${VERSION}
          \`\`\`
          EOF

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes-file release-notes.md

      - name: Skip publish and release (version already exists)
        if: steps.version_check.outputs.exists == 'true'
        run: echo "${{ steps.version_check.outputs.name }}@${{ steps.version_check.outputs.version }} already exists. Publish and release skipped."
